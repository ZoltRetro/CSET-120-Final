
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">

    <title>Login | Běi Dōng Nán Xī Měishí</title>
    <link rel="stylesheet" href="login.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>

<body>

    <header class="topbar">
        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="Restaurant Logo">
            <span>Běi Dōng Nán Xī Měishí</span>
        </a>
        <nav class="top-links">
            <a class="login" href="index.html">Menu</a>
            <a class="cart-link" href="cart.html" onclick="cartBoi()">🛒</a>
            <a href="login.html" class="active">Login</a>
            <a href="account.html" class="account"></a>
            
        </nav>
    </header>
    <main class="login-section">

    <!-- LOGIN SELECTION BUTTONS -->
    <div class="login-button-box">
        <button class="customer-button" onclick="loginDisplay('customer')">
            Customer Login
        </button>

        <button class="manager-button" onclick="loginDisplay('manager')">
            Manager Login
        </button>
    </div>

    <!-- CUSTOMER LOGIN -->
    <section id="customer-login" class="login-content">

        <div class="login-decoration">
            <span>EST. WORLDWIDE</span>
            <div class="decoration-line"></div>
        </div>

        <div class="form-box">

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Customer Login</h1>
            <p class="subtitle">Your table is waiting.</p>

            <div class="form-divider"></div>

            <form id="login-form">

                <label for="login-username">Username</label>
                <input type="text" id="login-username"
                    placeholder="Enter your username" required>

                <label for="login-password">Password</label>
                <input type="password" id="login-password"
                    placeholder="Enter your password" required>

                <button type="submit">Log In</button>

            </form>

            <p class="signup-prompt">
                Don't have an account?
                <a href="sign-up.html">Sign Up</a>
            </p>

        </div>
    </section>


    <!-- MANAGER LOGIN -->
    <section id="manager-login" class="login-content">

        <div class="manager-login-decoration">
            <span>MANAGEMENT ACCESS</span>
            <div class="decoration-line"></div>
        </div>

        <div class="form-box">

            <p class="eyebrow">WELCOME BACK</p>
            <h1>Manager Login</h1>
            <p class="subtitle">Your restaurant awaits.</p>

            <div class="form-divider"></div>

            <form id="manager-login-form">

                <label for="manager-login-username">Username</label>
                <input type="text" id="manager-login-username"
                    placeholder="Enter your username" required>

                <label for="manager-login-badge">Badge Number</label>
                <input type="text" id="manager-login-badge"
                    placeholder="Enter your badge number" required>

                <label for="manager-login-password">Password</label>
                <input type="password" id="manager-login-password"
                    placeholder="Enter your password" required>

                <button type="submit">Log In</button>

            </form>

        </div>
    </section>

</main>
